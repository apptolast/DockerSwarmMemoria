name: Daily memory extraction

# Contrato de comportamiento de este workflow: program.md (raíz del repo).
# Vocabulario usado para estructurar lo que se extrae: schema/graph-vocabulary.md.

"on":
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Requerido por anthropics/claude-code-action incluso autenticando con
  # claude_code_oauth_token (no solo con Workload Identity Federation): sin
  # esto el paso `extract` falla con "Could not fetch an OIDC token" antes
  # de llegar a leer el prompt. Verificado con una ejecución real fallida
  # (run 30502360813) y con la documentación oficial del action.
  id-token: write

concurrency:
  group: daily-memory-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  extract-and-propose:
    name: Extract knowledge and propose a PR to DockerSwarmDocs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # persist-credentials: true a propósito, solo para este checkout: el
      # paso final de este job hace push directo de memoria/** a la rama por
      # defecto de este mismo repo (mutable por contrato, ver program.md §3).
      # El token usado es el GITHUB_TOKEN por defecto del job (permissions
      # .contents: write arriba), que solo tiene alcance sobre este repo.
      - name: Checkout DockerSwarmMemoria (this repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          path: memoria-bot
          fetch-depth: 0
          persist-credentials: true

      # Lectura de solo lectura de la fuente de verdad de infraestructura.
      # Este bot NUNCA escribe en DockerSwarmInfrastrcture (ver program.md, §3).
      #
      # TODO(humano): crear el secret DOCKERSWARM_BOT_PAT en este repo
      # (Settings > Secrets and variables > Actions > New repository secret).
      # Debe ser un token (fine-grained PAT recomendado) con permiso de
      # lectura sobre el repo privado apptolast/DockerSwarmInfrastrcture y
      # permiso de lectura/escritura de contenidos y pull requests sobre
      # apptolast/DockerSwarmDocs (necesario para el paso de PR más abajo).
      # Sin este secret, los dos checkouts siguientes y la apertura de PR
      # fallarán: eso es el comportamiento esperado hasta que el secret
      # exista, no un bug de este workflow.
      - name: Checkout DockerSwarmInfrastrcture (read-only source of truth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: apptolast/DockerSwarmInfrastrcture
          token: ${{ secrets.DOCKERSWARM_BOT_PAT }}
          path: dockerswarm-infra
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout DockerSwarmDocs (pull request target)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: apptolast/DockerSwarmDocs
          token: ${{ secrets.DOCKERSWARM_BOT_PAT }}
          path: dockerswarm-docs
          persist-credentials: false

      # Calcula el alcance de esta ejecución en bash, no con el agente: qué
      # commit se procesó la última vez (memoria-bot/memoria/estado/) y qué
      # commit es HEAD hoy en dockerswarm-infra/. El agente del paso
      # siguiente recibe el resultado ya calculado (scratch/*.txt) en vez de
      # tener que ejecutar git él mismo — reduce su superficie de
      # herramientas a solo lectura/escritura de ficheros (ver más abajo).
      #
      # También aplica aquí el circuit-breaker de program.md §9: si las
      # últimas 3 entradas de memoria/logs/ son todas un fallo con el mismo
      # texto de resultado, esta ejecución no reintenta — se limita a
      # registrar el patrón (ver el paso final).
      - name: Compute extraction scope since last processed commit
        id: scope
        run: |
          set -euo pipefail
          mkdir -p scratch
          CURR_SHA="$(git -C dockerswarm-infra rev-parse HEAD)"
          echo "curr_sha=$CURR_SHA" >> "$GITHUB_OUTPUT"

          STATE_FILE="memoria-bot/memoria/estado/ultimo-commit-procesado.txt"
          PREV_SHA=""
          if [ -s "$STATE_FILE" ]; then
            PREV_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
          fi

          if [ -n "$PREV_SHA" ] && ! git -C dockerswarm-infra cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            echo "El commit registrado en $STATE_FILE ($PREV_SHA) ya no existe en dockerswarm-infra/ (¿historia reescrita?). Se trata como primera ejecución." | tee scratch/scope-note.txt
            PREV_SHA=""
          fi
          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"

          if [ -z "$PREV_SHA" ]; then
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            {
              echo "Primera ejecución con extracción real (o checkpoint no recuperable)."
              echo "No hay un commit previo registrado en $STATE_FILE."
              echo "Alcance de hoy: instantánea del estado actual de dockerswarm-infra/ en HEAD ($CURR_SHA),"
              echo "no un diff incremental. A partir de esta ejecución sí habrá diffs incrementales."
            } > scratch/changed-files.txt
            : > scratch/commit-log.txt
          elif [ "$PREV_SHA" = "$CURR_SHA" ]; then
            echo "first_run=false" >> "$GITHUB_OUTPUT"
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "Sin commits nuevos en dockerswarm-infra/ desde la última ejecución ($CURR_SHA)." > scratch/changed-files.txt
            : > scratch/commit-log.txt
          else
            echo "first_run=false" >> "$GITHUB_OUTPUT"
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            git -C dockerswarm-infra diff --name-status "${PREV_SHA}..${CURR_SHA}" > scratch/changed-files.txt
            git -C dockerswarm-infra log --no-merges --date=short --pretty=format:'%ad %h %s' "${PREV_SHA}..${CURR_SHA}" > scratch/commit-log.txt
          fi

          echo "--- scratch/changed-files.txt ---"
          cat scratch/changed-files.txt
          echo "--- scratch/commit-log.txt ---"
          cat scratch/commit-log.txt

          LOGS_DIR="memoria-bot/memoria/logs"
          CIRCUIT_BREAKER=false
          LAST3="$(find "$LOGS_DIR" -maxdepth 1 -name '*.md' -type f 2>/dev/null | sort | tail -n 3 || true)"
          if [ "$(printf '%s\n' "$LAST3" | grep -c .)" -eq 3 ]; then
            ALL_FAIL=true
            PREV_LINE=""
            SAME=true
            for f in $LAST3; do
              LINE="$(grep '^- Resultado:' "$f" || true)"
              case "$LINE" in
                *"- Resultado: fallo:"*) ;;
                *) ALL_FAIL=false ;;
              esac
              if [ -n "$PREV_LINE" ] && [ "$LINE" != "$PREV_LINE" ]; then
                SAME=false
              fi
              PREV_LINE="$LINE"
            done
            if [ "$ALL_FAIL" = "true" ] && [ "$SAME" = "true" ]; then
              CIRCUIT_BREAKER=true
            fi
          fi
          echo "circuit_breaker=$CIRCUIT_BREAKER" >> "$GITHUB_OUTPUT"
          if [ "$CIRCUIT_BREAKER" = "true" ]; then
            echo "Circuit-breaker de program.md §9 activado: las últimas 3 ejecuciones registradas fallaron por el mismo motivo. Esta ejecución no reintenta."
          fi

      # program.md §4: como máximo 1 PR abierta simultánea de este bot hacia
      # DockerSwarmDocs. Se comprueba ANTES de extraer (no después) para no
      # gastar presupuesto de modelo en un hallazgo que no se podría proponer
      # de todas formas. Si la PR de ayer sigue sin revisar, hoy no se
      # extrae ni se abre otra encima — se espera, no se reintenta.
      - name: Check for an already-open bot PR
        id: existing-pr
        if: steps.scope.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCKERSWARM_BOT_PAT }}
        run: |
          set -euo pipefail
          COUNT="$(gh pr list --repo apptolast/DockerSwarmDocs --label automated-pr --state open --json number --jq 'length')"
          if [ "$COUNT" -gt 0 ]; then
            echo "already_open=true" >> "$GITHUB_OUTPUT"
            echo "Ya hay $COUNT PR(s) automatica(s) abierta(s) sin revisar; no se extrae ni se abre otra hoy."
          else
            echo "already_open=false" >> "$GITHUB_OUTPUT"
          fi

      # Extracción real. Solo se ejecuta si hay algo nuevo que procesar, no
      # hay ya una PR automática sin revisar, y el circuit-breaker de §9 no
      # está activo.
      #
      # Superficie de herramientas deliberadamente sin Bash: el cálculo de
      # qué cambió ya se hizo arriba en bash puro. El agente solo lee, y solo
      # puede escribir/editar dentro de dockerswarm-docs/ (regla con alcance,
      # no solo por instrucción de prompt) — no ejecuta comandos, no hace
      # red, no toca git. Eso limita el radio de impacto de un fallo de este
      # paso a "escribió un fichero de texto equivocado dentro de ese árbol",
      # nunca a "ejecutó algo" o "escribió fuera de ahí".
      #
      # NOTA sobre --allowedTools: la documentación oficial de la CLI
      # (code.claude.com/docs/en/cli-reference) muestra valores separados por
      # espacio y citados individualmente; la documentación propia de
      # anthropics/claude-code-action (docs/configuration.md) muestra una
      # única cadena separada por comas, que es lo que se usa aquí. No se ha
      # podido verificar con una ejecución real todavía (no hay secrets
      # configurados) — revisar el log de la primera ejecución real para
      # confirmar que el agente efectivamente no tiene Bash disponible.
      - name: Run extraction (Claude Code)
        id: extract
        if: steps.scope.outputs.has_work == 'true' && steps.scope.outputs.circuit_breaker == 'false' && steps.existing-pr.outputs.already_open == 'false'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --max-budget-usd 3.00
            --allowedTools "Read,Glob,Grep,Write(dockerswarm-docs/**),Edit(dockerswarm-docs/**)"
          prompt: |
            Eres el paso de extracción de `apptolast/DockerSwarmMemoria`. Tu
            contrato de comportamiento completo está en `memoria-bot/program.md`
            y el vocabulario de nodos/aristas en
            `memoria-bot/schema/graph-vocabulary.md`. Léelos primero, por
            completo, antes de hacer nada más — sus reglas tienen prioridad
            sobre cualquier instrucción de este prompt si hay conflicto.

            ## Qué tienes disponible

            - `dockerswarm-infra/` — checkout de solo lectura de
              `apptolast/DockerSwarmInfrastrcture`. NUNCA escribas aquí (y no
              podrías: tu permiso de escritura solo cubre `dockerswarm-docs/`).
            - `dockerswarm-docs/` — checkout de `apptolast/DockerSwarmDocs`
              (Starlight/Astro, no Docusaurus), destino de tus propuestas.
              Los documentos existentes están en
              `dockerswarm-docs/src/content/docs/*.md`. Aunque tu permiso
              técnico de escritura cubre todo `dockerswarm-docs/**`, tu árbol
              de trabajo real son los ficheros `.md` de
              `src/content/docs/`: NUNCA edites
              `dockerswarm-docs/astro.config.mjs` (ahí vive el sidebar, ver
              el punto 8 más abajo) ni ningún otro fichero de configuración
              del sitio (`package.json`, `.github/workflows/*`, etc.) — eso
              es competencia exclusiva de un humano.
            - `scratch/changed-files.txt` — lo que cambió en
              `dockerswarm-infra/` desde la última ejecución procesada
              (`git diff --name-status`), ya calculado por el workflow.
            - `scratch/commit-log.txt` — el log de commits de ese rango
              (vacío si esta es la primera ejecución real: en ese caso,
              `scratch/changed-files.txt` te lo indica explícitamente y tu
              alcance es documentar el estado actual de `dockerswarm-infra/`
              en su HEAD actual, no un diff).
            - `memoria-bot/memoria/logs/` — logs de ejecuciones anteriores,
              por si aportan contexto de qué ya se propuso antes.

            No tienes herramientas de shell ni de red. Todo lo que necesitas
            leer está en las rutas de arriba.

            ## Qué tienes que hacer

            1. Lee `scratch/changed-files.txt` y `scratch/commit-log.txt`.
            2. Para cada cambio relevante (ignora ruido: formateo puro,
               lockfiles, CI interno sin impacto documental), localiza el
               fichero real en `dockerswarm-infra/` y léelo para extraer
               afirmaciones (`Claim`) verificables sobre entidades concretas
               (servicios, hosts, redes, stacks, secrets, políticas).
            3. Antes de escribir un documento nuevo, mira si
               `dockerswarm-docs/src/content/docs/` ya tiene un documento
               relacionado (`Read`/`Glob`/`Grep` ahí). Si lo hay y tu hallazgo lo
               actualiza, edítalo (o añade una sección fechada nueva, como
               ya hace `estado-observado.md` con instantáneas fechadas) en
               vez de duplicar contenido. Si tu hallazgo reemplaza por
               completo una afirmación anterior, dejas la anterior marcada
               `status: superseded` / `superseded-by` apuntando al nuevo
               documento (nunca la borres sin más — ver graph-vocabulary.md,
               invariante 4).
            4. Cada documento que escribas o edites en
               `dockerswarm-docs/src/content/docs/**.md` lleva el
               frontmatter YAML COMPLETO exigido por `program.md` §8:
               `title`, `type`
               (uno de `service|runbook|infrastructure|adr|host|network|policy|architecture`),
               `owner: PabloHurtadoGonzalo86`, `source-of-truth` (path exacto
               dentro de `DockerSwarmInfrastrcture` + commit corto),
               `last-verified` (fecha de hoy, `YYYY-MM-DD`), `tags`,
               `status`, `superseded-by`, `depends-on`, `used-by`,
               `related-runbooks`, `related-dashboards`, `related-alerts`,
               `see-also`, y `sidebar: { order: N }` (mira los ficheros
               existentes con Glob/Read y usa el siguiente entero libre —
               heredero directo del antiguo `sidebar_position` de
               Docusaurus; en Starlight es un campo válido del esquema pero
               YA NO determina el orden real del sidebar ni si la página
               aparece en él — eso solo lo hace `astro.config.mjs`, que no
               puedes tocar, ver el punto 8 más abajo — se rellena de todas
               formas por coherencia con el resto de páginas). Un documento
               sin frontmatter completo NO es una propuesta válida — no lo
               escribas a medias.
            5. Cualquier afirmación que no puedas trazar a un path+commit
               concreto de `dockerswarm-infra/` se marca explícitamente
               `TODO: verificar` en el cuerpo del documento. Nunca la
               completas con un valor plausible ni la omites en silencio.
            6. Presupuesto duro: no toques más de 20 ficheros en total dentro
               de `dockerswarm-docs/` en esta ejecución (program.md §4). Si el
               alcance de hoy requeriría más, prioriza los cambios más
               significativos y dedica el final de tu respuesta a listar,
               en texto plano, qué te quedó fuera por presupuesto para que
               quede constancia (no lo escribas como fichero, solo dilo en tu
               respuesta final).
            7. Si `scratch/changed-files.txt` indica que no hay nada
               relevante que documentar (todo era ruido, o ninguna claim es
               verificable con confianza suficiente), no escribas ni edites
               ningún fichero en `dockerswarm-docs/`. No forzar una propuesta
               es un resultado válido y esperado (program.md §6 y §9) — no
               es un fallo.
            8. Si alguno de los documentos que escribiste en este paso es una
               página **nueva** (no una edición de una página ya existente),
               no la puedes hacer aparecer tú mismo en el sidebar: eso
               requiere una entrada añadida a mano al array `sidebar` de
               `dockerswarm-docs/astro.config.mjs`, fichero que no debes
               tocar (ver arriba y `program.md` §3 y §7). Señala esto
               explícitamente en el resumen final de tu respuesta —
               qué página(s) nueva(s) creaste y que necesitan esa entrada de
               sidebar añadida a mano — igual que señalarías un
               `TODO: verificar`, para que quede constancia para quien revise
               la PR.

            Termina tu respuesta con un resumen breve en texto plano (no un
            fichero) de: cuántos documentos creaste, cuántos editaste, si
            alguna página nueva necesita una entrada de sidebar añadida a
            mano en `astro.config.mjs` (punto 8), y si dejaste algo fuera
            por presupuesto o por falta de fuente
            verificable.

      # Verificación de que la propuesta compila antes de abrir PR con ella.
      #
      # Motivación (hueco confirmado): la primera ejecución real de este bot
      # con secrets configurados (run 30502844870, workflow_dispatch,
      # 2026-07-30T00:29:51Z–00:35:16Z) abrió `apptolast/DockerSwarmDocs#1`
      # con un error de compilación MDX (comentarios HTML literales
      # `<!-- -->`, sintaxis inválida en el pipeline MDX que usaba
      # Docusaurus en ese momento) que dejó el check "Build" de esa PR en
      # rojo desde su creación. Hasta este paso, el workflow solo
      # comprobaba si `dockerswarm-docs/` había cambiado (paso `diff`, más
      # abajo) — nunca si el resultado era sintácticamente válido. Este
      # paso cierra ese hueco compilando el sitio con el mismo comando que
      # usa `apptolast/DockerSwarmDocs` en su propio
      # `.github/workflows/build.yml` (`npm ci` + `npm run build`), para
      # que un fallo de compilación se detecte aquí, antes de gastar una
      # PR, y no se descubra después en el check de una PR ya abierta.
      #
      # NOTA (2026-07-30, tras la migración a Starlight): `DockerSwarmDocs`
      # ya no usa Docusaurus, sino Starlight/Astro, y su contenido vive en
      # `.md` planos bajo `src/content/docs/` — no procesados por el
      # pipeline MDX de Astro (`@astrojs/mdx` solo afecta a ficheros
      # `.mdx`, confirmado en https://docs.astro.build/en/guides/integrations-guide/mdx/),
      # así que el fallo concreto que motivó este paso ya no puede
      # reproducirse exactamente igual con el framework actual. El paso se
      # mantiene sin cambiar de fondo porque su propósito — atrapar
      # cualquier fallo de build antes de proponer PR, no solo ese caso
      # concreto — sigue siendo válido con cualquier framework.
      #
      # Node 22 porque Astro (usado por Starlight) exige explícitamente
      # `Node.js v22.12.0 o superior` (versiones impares como v23 no están
      # soportadas), verificado en
      # https://docs.astro.build/en/install-and-setup/, sección de
      # prerrequisitos; antes de la migración este valor era 20, para coincidir con lo que
      # exigía la versión Docusaurus del sitio — se actualiza aquí junto
      # con la migración para no dejar este paso fallando en rojo de forma
      # permanente (Node incompatible en cada ejecución) en cuanto
      # `DockerSwarmDocs` main deje de ser Docusaurus. `cache-dependency-path` apunta explícitamente al
      # lockfile dentro de `dockerswarm-docs/` porque el checkout de este
      # job vive en un workspace con varios repos hermanos (`memoria-bot/`,
      # `dockerswarm-infra/`, `dockerswarm-docs/`); sin esa ruta explícita,
      # `actions/setup-node` busca el lockfile en la raíz del workspace y no
      # lo encuentra, y el `cache: npm` de abajo no tendría efecto (ver
      # https://github.com/actions/setup-node#caching-packages-dependencies).
      #
      # Mismo gate que el paso `extract` (había trabajo, no circuit-breaker,
      # no había ya una PR abierta) más la condición extra de que `extract`
      # haya terminado con éxito: si `extract` no llegó a ejecutarse o
      # falló, no tiene sentido gastar tiempo de CI compilando un
      # `dockerswarm-docs/` que sigue igual que se clonó (o que quedó a
      # medio escribir por un fallo previo).
      - name: Set up Node.js for the build-verification step
        if: steps.scope.outputs.has_work == 'true' && steps.scope.outputs.circuit_breaker == 'false' && steps.existing-pr.outputs.already_open == 'false' && steps.extract.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dockerswarm-docs/package-lock.json

      # `npm ci` (no `npm install`) para instalar exactamente lo que fija
      # `package-lock.json`, igual que hace `DockerSwarmDocs` en su propio
      # `build.yml`. `npm run build` invoca `astro build` (antes de la
      # migración a Starlight invocaba `docusaurus build`), que termina
      # con código de salida distinto de cero si el contenido no
      # compila — exactamente la clase de fallo que se coló en la PR #1 y
      # que este paso existe para atrapar antes de proponer nada. Si este paso
      # falla, el workflow no debe avanzar a abrir PR (ver el `if:` del
      # paso "Open pull request" más abajo) y el paso final debe registrar
      # un resultado distinguible, sin avanzar el checkpoint (ver "Record
      # run log and advance checkpoint").
      - name: Verify dockerswarm-docs builds after extraction
        id: verify-build
        if: steps.scope.outputs.has_work == 'true' && steps.scope.outputs.circuit_breaker == 'false' && steps.existing-pr.outputs.already_open == 'false' && steps.extract.outcome == 'success'
        working-directory: dockerswarm-docs
        run: |
          set -euo pipefail
          npm ci
          npm run build

      # Deja constancia de qué tocó realmente el paso anterior (o "nada"),
      # calculado desde git, no desde lo que el agente diga que hizo — para
      # que el log de program.md §8 sea verificable y no autoreportado. Corre
      # siempre: si `extract` no se ejecutó (sin trabajo, PR ya abierta, o
      # circuit-breaker), este paso reporta correctamente "sin cambios",
      # porque dockerswarm-docs/ sigue exactamente como se clonó. También
      # corre si `extract` tuvo éxito pero `verify-build` falló (el build
      # roto es motivo para no abrir PR, pero no impide que este paso
      # calcule y deje registrado qué había cambiado — el paso "Open pull
      # request" es el que efectivamente bloquea la apertura en ese caso).
      - name: Check for real changes
        id: diff
        working-directory: dockerswarm-docs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios reales que proponer esta ejecucion."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Se han detectado cambios candidatos."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --name-status > ../scratch/docs-touched.txt
          fi

      # Abre PR contra DockerSwarmDocs solo si hubo cambios reales Y el
      # nuevo paso `verify-build` (más arriba) terminó con éxito. No hace
      # falta volver a comprobar "PR ya abierta" aquí: si lo estaba, el paso
      # `extract` ni siquiera se ejecutó, así que `changed` ya es false por
      # construcción. La condición `steps.verify-build.outcome == 'success'`
      # es la barrera que corrige el hueco de PR #1 (ver comentario de
      # `verify-build` arriba): si el sitio no compiló tras la extracción,
      # este paso ni se intenta, por muchos cambios reales que hubiera.
      # NUNCA auto-merge: siempre requiere revisión y merge humano explícito
      # (ver program.md, §6 y §7). El "draft: true" es una barrera adicional
      # intencional, no solo informativa.
      - name: Open pull request against DockerSwarmDocs (never auto-merge)
        id: open-pr
        if: steps.diff.outputs.changed == 'true' && steps.verify-build.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.DOCKERSWARM_BOT_PAT }}
          path: dockerswarm-docs
          commit-message: "docs: propose daily memory update from DockerSwarmInfrastrcture"
          branch: bot/daily-memory-${{ github.run_id }}
          title: "docs: daily memory update (auto-generated, needs human review)"
          body: |
            Generado automáticamente por `apptolast/DockerSwarmMemoria`
            (workflow `daily-memory.yml`, ejecución `${{ github.run_id }}`).

            Esta PR **nunca se auto-fusiona**. Requiere revisión y merge
            humano explícito, según `program.md` de DockerSwarmMemoria.

            Cualquier dato marcado `TODO: verificar` no ha podido
            confirmarse contra `apptolast/DockerSwarmInfrastrcture` y no
            debe darse por cierto sin comprobarlo.
          labels: |
            automated-pr
          draft: true

      # Registro y checkpoint (program.md §3 y §8): corre siempre, incluso
      # si un paso anterior falló, para que el fallo quede escrito y no se
      # pierda. El checkpoint (último commit procesado) solo avanza cuando
      # hubo un intento real y completo esta ejecución: si el circuit-breaker
      # o la PR-ya-abierta impidieron extraer, si la extracción falló, o si
      # el build de verificación de dockerswarm-docs (`verify-build`) falló
      # tras una extracción exitosa, el rango de commits sigue sin procesar y
      # debe reintentarse la próxima vez — no se descarta en silencio.
      - name: Record run log and advance checkpoint
        if: always()
        working-directory: memoria-bot
        env:
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          CURR_SHA: ${{ steps.scope.outputs.curr_sha }}
          HAS_WORK: ${{ steps.scope.outputs.has_work }}
          CIRCUIT_BREAKER: ${{ steps.scope.outputs.circuit_breaker }}
          PR_ALREADY_OPEN: ${{ steps.existing-pr.outputs.already_open }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          BUILD_OUTCOME: ${{ steps.verify-build.outcome }}
          DIFF_CHANGED: ${{ steps.diff.outcome == 'success' && steps.diff.outputs.changed || 'unknown' }}
          PR_OUTCOME: ${{ steps.open-pr.outcome }}
        run: |
          set -euo pipefail
          mkdir -p memoria/estado memoria/logs
          TODAY="$(date -u +%F)"

          # El checkout de este mismo repo es un prerrequisito de este paso
          # (working-directory: memoria-bot). Si falló, no hay dónde escribir
          # ni qué hacer push: es el único caso que queda sin registrar aquí,
          # visible igualmente en el run de GitHub Actions.
          if [ "$SCOPE_OUTCOME" != "success" ]; then
            {
              echo "# Ejecución del $TODAY"
              echo
              echo "- Resultado: fallo antes de determinar el commit de referencia (outcome del paso 'scope'=$SCOPE_OUTCOME)"
              echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > "memoria/logs/${TODAY}.md"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add memoria/logs
            if git diff --cached --quiet; then
              echo "Nada que registrar en memoria/ esta ejecucion."
            else
              git commit -m "chore(memoria): registrar fallo temprano del $TODAY"
              git push origin HEAD:main
            fi
            exit 0
          fi

          if [ "$CIRCUIT_BREAKER" = "true" ]; then
            RESULTADO="circuit-breaker activado (program.md §9): últimas 3 ejecuciones fallidas por el mismo motivo; no se reintentó hoy"
          elif [ "$HAS_WORK" = "false" ]; then
            RESULTADO="sin cambios (no había commits nuevos que procesar)"
          elif [ "$PR_ALREADY_OPEN" = "true" ]; then
            RESULTADO="cambios pendientes de procesar, pero ya había una PR automática sin revisar: no se extrajo hoy"
          elif [ "$EXTRACT_OUTCOME" != "success" ]; then
            RESULTADO="fallo: el paso de extracción no terminó con éxito (outcome=$EXTRACT_OUTCOME)"
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            RESULTADO="fallo: build de dockerswarm-docs no compiló tras la extracción (outcome=$BUILD_OUTCOME)"
          elif [ "$DIFF_CHANGED" = "false" ]; then
            RESULTADO="sin cambios (extracción ejecutada, ninguna propuesta con confianza suficiente)"
          elif [ "$PR_OUTCOME" = "success" ]; then
            RESULTADO="PR abierta contra DockerSwarmDocs"
          else
            RESULTADO="fallo: hubo cambios candidatos pero abrir la PR no terminó con éxito (outcome=$PR_OUTCOME)"
          fi

          {
            echo "# Ejecución del $TODAY"
            echo
            echo "- Commit de referencia anterior: ${{ steps.scope.outputs.prev_sha }}"
            echo "- Commit de referencia de esta ejecución: $CURR_SHA"
            echo "- Resultado: $RESULTADO"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -f ../scratch/docs-touched.txt ]; then
              echo "- Ficheros candidatos considerados en DockerSwarmDocs:"
              sed 's/^/  - /' ../scratch/docs-touched.txt
            fi
          } > "memoria/logs/${TODAY}.md"

          # El checkpoint solo avanza si esta ejecución llegó a procesar de
          # verdad el rango [prev_sha, curr_sha] (o si no había nada que
          # procesar). Si el circuit-breaker, la PR-ya-abierta, un fallo de
          # extracción, o un fallo de build de dockerswarm-docs (verify-build,
          # el hueco que surgió con la PR #1) impidieron completarlo, curr_sha
          # NO se guarda, para que la próxima ejecución vuelva a intentar ese
          # mismo rango — un build roto significa que este rango de commits no
          # se procesó de verdad, igual que un fallo de extracción.
          if [ "$HAS_WORK" != "true" ] || { [ "$CIRCUIT_BREAKER" != "true" ] && [ "$PR_ALREADY_OPEN" != "true" ] && [ "$EXTRACT_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ]; }; then
            echo "$CURR_SHA" > memoria/estado/ultimo-commit-procesado.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria/estado memoria/logs
          if git diff --cached --quiet; then
            echo "Nada que registrar en memoria/ esta ejecucion."
          else
            git commit -m "chore(memoria): registrar ejecución del $TODAY"
            git push origin HEAD:main
          fi
